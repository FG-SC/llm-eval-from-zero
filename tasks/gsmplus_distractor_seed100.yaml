# C1: GSM-Plus "distraction insertion" variants of the same 100 seeds, zero-shot, prompt P0.
# Same answer as the seed, so it is scored exactly like C0 (block copied from gsm8k_seed100.yaml).
task: gsmplus_distractor_seed100
dataset_path: qintongli/GSM-Plus
dataset_kwargs:
  revision: 3b708db57b96a16e8e3368ed2956990c0809440e
output_type: generate_until
training_split: null
fewshot_split: null
test_split: test
process_docs: !function gsmplus.process_docs_distractor
doc_to_text: !function utils.doc_to_text_p0
doc_to_target: "{{answer}}"
num_fewshot: 0
generation_kwargs:
  until: []
  do_sample: false
  temperature: 0.0
  max_gen_toks: 2048
repeats: 1
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: false
    regexes_to_ignore:
      - ","
      - "\\$"
      - "(?s).*#### "
      - "\\.$"
filter_list:
  - name: "strict-match"
    filter:
      - function: "regex"
        regex_pattern: "#### (\\-?[0-9\\.\\,]+)"
      - function: "take_first"
  - name: "flexible-extract"
    filter:
      - function: "regex"
        group_select: -1
        regex_pattern: "(-?[$0-9.,]{2,})|(-?[0-9]+)"
      - function: "take_first"
metadata:
  version: 1.0
